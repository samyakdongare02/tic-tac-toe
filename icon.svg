<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- grid lines -->
  <g stroke="url(#grid)" stroke-width="26" stroke-linecap="round">
    <line x1="196" y1="96"  x2="196" y2="416"/>
    <line x1="316" y1="96"  x2="316" y2="416"/>
    <line x1="96"  y1="196" x2="416" y2="196"/>
    <line x1="96"  y1="316" x2="416" y2="316"/>
  </g>

  <!-- X (top-left) -->
  <g stroke="#38bdf8" stroke-width="26" stroke-linecap="round">
    <line x1="118" y1="118" x2="174" y2="174"/>
    <line x1="174" y1="118" x2="118" y2="174"/>
  </g>

  <!-- O (center) -->
  <circle cx="256" cy="256" r="40" fill="none" stroke="#f472b6" stroke-width="26"/>

  <!-- X (bottom-right) -->
  <g stroke="#38bdf8" stroke-width="26" stroke-linecap="round">
    <line x1="338" y1="338" x2="394" y2="394"/>
    <line x1="394" y1="338" x2="338" y2="394"/>
  </g>
</svg>
