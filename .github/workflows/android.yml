name: Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Game-logic regression tests over the real script.js (mocked-DOM harness).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Gameplay regression tests
        run: node tests/tictac.test.js

      - name: Exhaustive AI tests (all 2097 reachable positions)
        run: node tests/ai.test.js

  # Build both variants, then validate metadata, signature, bundle and
  # checksum of the release APK before publishing it as an artifact.
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null || true
            "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager not found - AGP will download SDK components automatically"
          fi

      - name: Generate launcher icon from SVG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          rsvg-convert -w 192 -h 192 icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Bundle web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html script.js style.css icon.svg manifest.webmanifest sw.js android/app/src/main/assets/

      - name: Prepare signing keystore (ephemeral when secrets are absent)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            STOREPASS="$SECRET_STORE_PASS"
            KEYPASS="$SECRET_KEY_PASS"
            ALIAS="$SECRET_ALIAS"
          else
            echo "No keystore secrets found - generating an ephemeral key"
            keytool -genkeypair -keystore "$KS" -alias key0 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 \
              -dname "CN=Tic-Tac-Toe, OU=GitHub Actions"
            STOREPASS=android123
            KEYPASS=android123
            ALIAS=key0
          fi
          {
            echo "ANDROID_KEYSTORE_FILE=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$STOREPASS"
            echo "ANDROID_KEY_PASSWORD=$KEYPASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build debug and signed release APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TicTacToe-1.0.1.apk

      - name: Validate APK metadata, signature and bundle
        run: |
          set -eo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK="TicTacToe-1.0.1.apk"

          echo "### Release APK validation" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          "$BT/aapt2" dump badging "$APK" \
            | grep -E '^package:|sdkVersion:|targetSdkVersion:|application-label:' \
            | tee badging.txt >> "$GITHUB_STEP_SUMMARY"

          for f in index.html script.js style.css icon.svg manifest.webmanifest sw.js; do
            unzip -l "$APK" | grep -q "assets/$f" || { echo "MISSING assets/$f"; exit 1; }
          done
          echo "bundled web assets: all 6 present" >> "$GITHUB_STEP_SUMMARY"

          "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 \
            | head -n 12 | tee sig.txt >> "$GITHUB_STEP_SUMMARY"

          sha256sum "$APK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: TicTacToe-1.0.1-apk
          path: TicTacToe-1.0.1.apk
          if-no-files-found: error

      - name: Attach to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: TicTacToe-1.0.1.apk

  # Runtime validation: install and launch the built APK on a real emulator,
  # verify the installed version, confirm the process survives, scan for
  # crashes and capture a screenshot as visual evidence.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          pattern: TicTacToe-*-apk
          merge-multiple: true
          path: artifact

      - name: Install, launch and validate on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            set -e
            APK_FILE=$(find artifact -name '*.apk' | head -n 1)
            echo "Installing $APK_FILE"
            adb install -r "$APK_FILE"
            adb shell am start -W -n com.samyakdongare.tictactoe/.MainActivity | tee launch.txt
            grep -q "Status: ok" launch.txt
            sleep 8
            PID=$(adb shell pidof com.samyakdongare.tictactoe || true)
            echo "app pid: $PID"
            [ -n "$PID" ] || { echo "FAIL: app process is not running"; exit 1; }
            adb shell dumpsys package com.samyakdongare.tictactoe | grep -m1 versionName
            if adb logcat -d | grep -A4 "FATAL EXCEPTION" | grep -q "com.samyakdongare.tictactoe"; then
              echo "FAIL: crash detected for our process"
              adb logcat -d | grep -A20 "FATAL EXCEPTION"
              exit 1
            fi
            adb exec-out screencap -p > game-screen.png
            ls -la game-screen.png

      - name: Upload runtime screenshot
        uses: actions/upload-artifact@v7
        with:
          name: emulator-screenshot
          path: game-screen.png
          if-no-files-found: error
